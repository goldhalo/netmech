name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Linux / GCC + Clang
  # ---------------------------------------------------------------------------
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: 安装编译器
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++
          else
            sudo apt-get install -y clang++
          fi

      - name: 配置
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc CXX=g++
          else
            export CC=clang CXX=clang++
          fi
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DNETMECH_WARNINGS_AS_ERRORS=ON

      - name: 构建
        run: cmake --build build --parallel

      - name: 测试
        run: ctest --test-dir build --output-on-failure

      - name: 直接运行测试（获取详细输出）
        if: failure()
        run: ./build/bin/netmech_ut --verbose || true

  # ---------------------------------------------------------------------------
  # Windows / MSVC
  #
  # 生成器用 Ninja 而**不用** Visual Studio 生成器：后者的探测在 runner 镜像
  # 升级后接连失效（"could not find any instance of Visual Studio"、
  # "Failed to run MSBuild command ... no such file"）。msvc-dev-cmd 摆好 cl
  # 的环境再走 Ninja，稳定且日志直白。
  #
  # 失败时把 cmake 的关键错误用 ::error:: 打到 annotation 上 ——
  # Actions 的原始日志要通过 API 取需要仓库管理员权限，annotation 是公开的。
  # ---------------------------------------------------------------------------
  windows:
    name: Windows / MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 配置
        shell: pwsh
        run: |
          $out  = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNETMECH_WARNINGS_AS_ERRORS=ON 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n"
            $idx = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'CMake Error') { $idx = $i; break }
            }
            if ($idx -ge 0) {
              $end  = [Math]::Min($idx + 7, $lines.Count - 1)
              $errs = ($lines[$idx..$end] | Where-Object { $_.Trim() -ne '' }) -join ' | '
            } else {
              $errs = (($lines | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 8) -join ' | '
            }
            Write-Host "::error title=Windows configure failed::$errs"
            exit 1
          }

      - name: 构建
        shell: pwsh
        run: |
          $out  = cmake --build build --parallel 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'error C|: fatal|error MSB' } | Select-Object -First 2) -join ' | '
            Write-Host "::error title=Windows build failed::$line"
            exit 1
          }

      - name: 测试
        shell: pwsh
        run: |
          $exe = ".\build\bin\netmech_ut.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::找不到 $exe"; exit 1 }
          $out  = & $exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'FAIL' } | Select-Object -First 3) -join ' | '
            Write-Host "::error title=Windows 单测失败::$line"
            exit 1
          }

  # ---------------------------------------------------------------------------
  # 质量门禁
  # ---------------------------------------------------------------------------
  quality:
    name: 质量检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 检查禁止的 C++20 特性
        run: |
          echo "检查源码中是否出现 C++20 构造..."
          FAIL=0
          for pat in 'co_await' 'co_return' 'co_yield' 'std::span' 'std::format' \
                     'std::jthread' 'std::atomic_ref' '\bconcept\b' '\branges::' '<=>'; do
            if grep -rEn "$pat" include/ src/ example/ test/ --include='*.hpp' --include='*.cpp' 2>/dev/null; then
              echo "❌ 发现禁止的构造: $pat"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ 未发现 C++20 构造"

      - name: 检查不得引入 Boost 依赖
        run: |
          if grep -rn 'boost::' include/ src/ example/ test/ \
               --include='*.hpp' --include='*.cpp' | grep -v '^\s*//' | grep -v '注释'; then
            echo "❌ 发现 boost:: 引用（本项目不依赖 Boost）"
            exit 1
          fi
          echo "✅ 无 Boost 依赖"

      - name: 检查 thirdparty 完整性
        run: |
          if [ ! -f thirdparty/asio/include/asio.hpp ]; then
            echo "❌ 缺少 thirdparty/asio/include/asio.hpp"
            exit 1
          fi
          if [ ! -f thirdparty/asio/LICENSE_1_0.txt ]; then
            echo "❌ 缺少 Asio 许可证文件（Boost License 要求保留）"
            exit 1
          fi
          echo "✅ thirdparty 完整"
