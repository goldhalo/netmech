name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# netmech 是这一族库的地基，六个仓（netmech / modbusmech / rtspmech /
# rtpmech / mpegmech / httpmech）用同一套 CI 结构，方便对照。

jobs:
  # ---------------------------------------------------------------------------
  # Linux / GCC + Clang
  # ---------------------------------------------------------------------------
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++
          else
            # 用 runner 预装的 clang：apt 装 clang++ 常因版本被钉死而失败
            clang++ --version || { echo "::error::runner 上没有预装 clang++"; exit 1; }
          fi

      - name: 配置
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc CXX=g++
          else
            export CC=clang CXX=clang++
          fi
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DNETMECH_WARNINGS_AS_ERRORS=ON

      # 构建失败时把第一行错误打进 annotation：
      # Actions 原始日志要通过 API 取需要管理员权限，annotation 是公开的。
      - name: 构建
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            line=$(grep -m1 -E "error:" /tmp/build.log | cut -c1-300)
            [ -z "$line" ] && line=$(grep -m1 -E "warning:" /tmp/build.log | cut -c1-300)
            echo "::error title=构建失败::$line"
            exit 1
          fi

      - name: 测试
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: 直接运行测试（失败时取详细输出）
        if: failure()
        run: ./build/bin/netmech_ut --verbose || true

  # ---------------------------------------------------------------------------
  # Windows / MSVC
  #
  # 用 Ninja 而不用 Visual Studio 生成器：后者的探测在 runner 镜像升级后
  # 接连失效（找不到 VS、或 MSBuild 起不来）。msvc-dev-cmd 摆好 cl 的环境
  # 再走 Ninja 更稳。
  # ---------------------------------------------------------------------------
  windows:
    name: Windows / MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 配置
        shell: pwsh
        run: |
          $out  = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNETMECH_WARNINGS_AS_ERRORS=ON 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n"
            $idx = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'CMake Error') { $idx = $i; break }
            }
            if ($idx -ge 0) {
              $end  = [Math]::Min($idx + 7, $lines.Count - 1)
              $errs = ($lines[$idx..$end] | Where-Object { $_.Trim() -ne '' }) -join ' | '
            } else {
              $errs = (($lines | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 8) -join ' | '
            }
            Write-Host "::error title=Windows configure failed::$errs"
            exit 1
          }

      - name: 构建
        shell: pwsh
        run: |
          $out  = cmake --build build --parallel 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'error C|: fatal|error MSB' } | Select-Object -First 2) -join ' | '
            Write-Host "::error title=Windows build failed::$line"
            exit 1
          }

      - name: 测试
        shell: pwsh
        run: |
          $exe = ".\build\bin\netmech_ut.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::找不到 $exe"; exit 1 }
          $out  = & $exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'FAIL' } | Select-Object -First 3) -join ' | '
            Write-Host "::error title=Windows 单测失败::$line"
            exit 1
          }

  # ---------------------------------------------------------------------------
  # ASan + UBSan
  #
  # 为什么要单独跑一遍：越界读和"无符号下溢"在 Release 上通常**没有任何症状** ——
  # 读到垃圾数据被当成未知字段跳过，或者循环多转几圈但结果碰巧对。
  # 2026-11 就出过一次：mpegmech 的 test_g711_ps 在 Windows Debug 上卡 120 秒，
  # 根因是 `in[code_at]` 越界读 + `in.size() - scan` 下溢；Linux Release 一直绿。
  #
  # 关掉 detect_leaks：库里有些对象是刻意长命的（进程级 io 池等），
  # 让 LeakSanitizer 报它们只会训练大家忽略告警。
  # ---------------------------------------------------------------------------
  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: 配置（Debug + sanitizer）
        run: |
          cmake -S . -B build-san -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
                -DNETMECH_BUILD_TESTS=ON

      - name: 构建
        run: cmake --build build-san --parallel

      - name: 测试（sanitizer 一旦报错立即失败）
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-san --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  # 质量门禁
  # ---------------------------------------------------------------------------
  quality:
    name: 质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 检查禁止的 C++20 特性
        run: |
          FAIL=0
          # 只看代码，跳过纯注释行（注释里提到 std::span / boost:: 是正常的）
          for pat in 'co_await' 'co_return' 'co_yield' 'std::span' 'std::format' \
                     'std::jthread' 'std::atomic_ref' '\bconcept\b' '\branges::' '<=>'; do
            hits=$(grep -rEn "$pat" include/ src/ example/ test/ \
                     --include='*.hpp' --include='*.cpp' 2>/dev/null \
                   | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
            if [ -n "$hits" ]; then
              echo "❌ 发现禁止的构造: $pat"
              echo "$hits"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ 未发现 C++20 构造"

      - name: 检查不得引入 Boost 依赖
        run: |
          # 只看 #include：注释里写 boost:: 是在讲"为什么不用它"。
          # 注意 asio 不在此列 —— 本库用的就是 thirdparty 里那份独立 Asio。
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(boost|openssl)/' \
               include/ src/ example/ test/ --include='*.hpp' --include='*.cpp'; then
            echo "❌ 发现有 boost / openssl 的 #include（本库只用 thirdparty 里的独立 Asio）"
            exit 1
          fi
          echo "✅ 无 Boost 依赖"

      - name: 检查 thirdparty 完整性
        run: |
          if [ ! -f thirdparty/asio/include/asio.hpp ]; then
            echo "❌ 缺少 thirdparty/asio/include/asio.hpp"
            exit 1
          fi
          if [ ! -f thirdparty/asio/LICENSE_1_0.txt ]; then
            echo "❌ 缺少 Asio 许可证文件（Boost License 要求保留）"
            exit 1
          fi
          echo "✅ thirdparty 完整"

      - name: 检查每个对外头文件可单独包含
        run: |
          sudo apt-get update && sudo apt-get install -y g++
          FAIL=0
          for h in include/netmech/*.hpp; do
            name=$(basename "$h" .hpp)
            printf '#include <netmech/%s.hpp>\nint main(){return 0;}\n' "$name" > /tmp/one.cpp
            if ! g++ -std=c++17 -fsyntax-only -Wall -Wextra \
                 -Iinclude -Ithirdparty/asio/include /tmp/one.cpp; then
              echo "❌ $name.hpp 不能单独包含"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ 全部头文件自包含"
