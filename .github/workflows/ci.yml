name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# netmech 是这一族库的地基，六个仓（netmech / modbusmech / rtspmech /
# rtpmech / mpegmech / httpmech）用同一套 CI 结构，方便对照。

jobs:
  # ---------------------------------------------------------------------------
  # Linux / GCC + Clang
  # ---------------------------------------------------------------------------
  linux:
    name: Linux / ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            sudo apt-get install -y g++
          else
            # 用 runner 预装的 clang：apt 装 clang++ 常因版本被钉死而失败
            clang++ --version || { echo "::error::runner 上没有预装 clang++"; exit 1; }
          fi

      - name: 配置
        run: |
          if [ "${{ matrix.compiler }}" = "gcc" ]; then
            export CC=gcc CXX=g++
          else
            export CC=clang CXX=clang++
          fi
          # 注意：-Werror 只作用于**库与 example/**；test/ 不看告警，用例过即可
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
                -DNETMECH_WARNINGS_AS_ERRORS=ON

      # 构建失败时把第一行错误打进 annotation：
      # Actions 原始日志要通过 API 取需要管理员权限，annotation 是公开的。
      - name: 构建
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            line=$(grep -m1 -E "error:" /tmp/build.log | cut -c1-300)
            [ -z "$line" ] && line=$(grep -m1 -E "warning:" /tmp/build.log | cut -c1-300)
            echo "::error title=构建失败::$line"
            exit 1
          fi

      - name: 测试
        run: ctest --test-dir build --output-on-failure --timeout 120

      - name: 直接运行测试（失败时取详细输出）
        if: failure()
        run: ./build/bin/netmech_ut --verbose || true

  # ---------------------------------------------------------------------------
  # Windows / MSVC
  #
  # 用 Ninja 而不用 Visual Studio 生成器：后者的探测在 runner 镜像升级后
  # 接连失效（找不到 VS、或 MSBuild 起不来）。msvc-dev-cmd 摆好 cl 的环境
  # 再走 Ninja 更稳。
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # 共享库构建（多 .so 部署的主推形态）
  #
  # 背景：一个进程里多个 .so 各自静态链接 netmech 时，代码与静态数据（ion 池、
  # asio 的线程局部状态、注册表）都是每模块一份 —— 跨模块混用同一个 io_context
  # 会在 asio 内部崩溃（实测 SIGSEGV in asio scheduler）。SHARED 构建让全进程
  # 只有一份代码，问题消失。
  #
  # test/multi_so 只在本构建下注册：两个 .so 共用宿主注入的 Runtime，断言
  # "只多出宿主那 4 条 io 线程"。
  # ---------------------------------------------------------------------------
  shared:
    name: Linux / gcc / Shared
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DNETMECH_LIBRARY_TYPE=SHARED \
                -DNETMECH_WARNINGS_AS_ERRORS=ON

      - name: 构建
        run: cmake --build build --parallel

      - name: 测试
        run: ctest --test-dir build --output-on-failure --timeout 120

  # ---------------------------------------------------------------------------
  # TLS（v0.91，可选能力，默认 OFF）
  #
  # OpenSSL **不由本仓提供**：Linux 用发行版 libssl-dev，Windows 用 choco 装的
  # 开发包；两边都走标准 find_package(OpenSSL)，行为一致。
  # 这里有 3 条真实握手用例（自签 + 指纹 pin / pin 不匹配 / 明文打 TLS 端口），
  # 只在 NETMECH_TLS=ON 的构建里编译。
  # ---------------------------------------------------------------------------
  linux-tls:
    name: Linux / gcc / TLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具（含 OpenSSL 开发包）
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev

      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DNETMECH_TLS=ON \
                -DNETMECH_WARNINGS_AS_ERRORS=ON

      - name: 构建
        run: |
          set +e
          cmake --build build --parallel 2>&1 | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            line=$(grep -m1 -E "error:" /tmp/build.log | cut -c1-300)
            [ -z "$line" ] && line=$(grep -m1 -E "undefined reference" /tmp/build.log | cut -c1-300)
            echo "::error title=TLS 构建失败::$line"
            grep -E "error:|warning:" /tmp/build.log | head -10
            exit 1
          fi

      - name: 测试
        run: ctest --test-dir build --output-on-failure --timeout 300

  windows:
    name: Windows / MSVC / ${{ matrix.build_type }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 配置
        shell: pwsh
        run: |
          $out  = cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DNETMECH_WARNINGS_AS_ERRORS=ON 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $lines = $out -split "`r?`n"
            $idx = -1
            for ($i = 0; $i -lt $lines.Count; $i++) {
              if ($lines[$i] -match 'CMake Error') { $idx = $i; break }
            }
            if ($idx -ge 0) {
              $end  = [Math]::Min($idx + 7, $lines.Count - 1)
              $errs = ($lines[$idx..$end] | Where-Object { $_.Trim() -ne '' }) -join ' | '
            } else {
              $errs = (($lines | Where-Object { $_.Trim() -ne '' }) | Select-Object -Last 8) -join ' | '
            }
            Write-Host "::error title=Windows configure failed::$errs"
            exit 1
          }

      - name: 构建
        shell: pwsh
        run: |
          $out  = cmake --build build --parallel 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'error C|: fatal|error MSB' } | Select-Object -First 2) -join ' | '
            Write-Host "::error title=Windows build failed::$line"
            exit 1
          }

      - name: 测试
        shell: pwsh
        run: |
          $exe = ".\build\bin\netmech_ut.exe"
          if (-not (Test-Path $exe)) { Write-Host "::error::找不到 $exe"; exit 1 }
          $out  = & $exe 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'FAIL' } | Select-Object -First 3) -join ' | '
            Write-Host "::error title=Windows 单测失败::$line"
            exit 1
          }

  # ---------------------------------------------------------------------------
  # ASan + UBSan
  #
  # 为什么要单独跑一遍：越界读和"无符号下溢"在 Release 上通常**没有任何症状** ——
  # 读到垃圾数据被当成未知字段跳过，或者循环多转几圈但结果碰巧对。
  # 2026-11 就出过一次：mpegmech 的 test_g711_ps 在 Windows Debug 上卡 120 秒，
  # 根因是 `in[code_at]` 越界读 + `in.size() - scan` 下溢；Linux Release 一直绿。
  #
  # 关掉 detect_leaks：库里有些对象是刻意长命的（进程级 io 池等），
  # 让 LeakSanitizer 报它们只会训练大家忽略告警。
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Windows 共享库（DLL）：验证 NETMECH_API 的导出/导入面
  #   多 .so/DLL 部署必须用 SHARED（静态库会把 netmech 复制进每个模块，
  #   跨模块混用同一个 io_context 会崩，见 runtime.hpp 的说明）。
  # ---------------------------------------------------------------------------
  windows-shared:
    name: Windows / MSVC / Shared
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出
        uses: actions/checkout@v4

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 配置
        shell: pwsh
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DNETMECH_LIBRARY_TYPE=SHARED

      - name: 构建
        shell: pwsh
        run: cmake --build build --parallel

      - name: 测试
        shell: pwsh
        run: ctest --test-dir build --output-on-failure --timeout 120

  # ---------------------------------------------------------------------------
  # Windows TLS：用 choco 装的 OpenSSL 开发包（与 Linux 的 libssl-dev 对等）
  #
  # ★ 非门禁（continue-on-error）：runner 上 choco 装出来的 OpenSSL 是哪一版、
  #   是 DLL 导入库还是 /MT 静态库，都不由我们控制 —— 曾因这个差异构建失败，
  #   而同一份代码在本机（自编 OpenSSL 3.0.15 + MSVC）96/96 用例全绿。
  #   所以 Windows 的 TLS **门禁放在 Linux**（linux-tls / sanitizers-tls /
  #   tsan-tls），这个 job 只作为"环境漂移"的信号：红了自己看一眼，别卡发版。
  #   本机验证步骤见 docs/TLS.md §2.3。
  # ---------------------------------------------------------------------------
  windows-tls:
    name: Windows / MSVC / TLS
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 安装 OpenSSL（开发包）
        shell: pwsh
        run: |
          choco install openssl --yes --no-progress
          $root = Get-ChildItem "C:\Program Files\OpenSSL*" -Directory -ErrorAction SilentlyContinue |
                  Select-Object -First 1
          if (-not $root) { Write-Host "::error::找不到 OpenSSL 安装目录"; exit 1 }
          Write-Host "OpenSSL: $($root.FullName)"
          "OPENSSL_ROOT=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii

      - name: 配置 MSVC 环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 配置
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug `
                -DNETMECH_TLS=ON -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT" `
                -DNETMECH_WARNINGS_AS_ERRORS=ON
          # 把探测到的 OpenSSL 路径/版本留在日志里，便于排查"装错版本/找不到库"
          Select-String -Path build\CMakeCache.txt -Pattern '^OPENSSL_(INCLUDE|SSL|CRYPTO)' |
            ForEach-Object { Write-Host $_.Line }

      - name: 构建
        shell: pwsh
        run: |
          $out  = cmake --build build --parallel 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $out
          if ($code -ne 0) {
            # 把 warning Cxxxx 也带上：/WX 下真正的元凶往往是上一行的 warning
            $line = ($out -split "`r?`n" | Where-Object { $_ -match 'warning C\d|error C\d|error LNK|error MSB|: fatal' } |
                     Select-Object -First 3) -join ' | '
            Write-Host "::error title=TLS 构建失败::$line"
            exit 1
          }

      - name: 测试
        shell: pwsh
        run: |
          # 运行期需要 libssl-3-x64.dll / libcrypto-3-x64.dll
          $env:PATH = "$env:OPENSSL_ROOT\bin;$env:PATH"
          ctest --test-dir build --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  # 基准 smoke（非门禁）：只验证 bench 能构建、能跑出数值，不比较性能数字。
  # ---------------------------------------------------------------------------
  bench-smoke:
    name: Bench / smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: 配置（Release + bench）
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DNETMECH_BUILD_BENCH=ON \
                -DNETMECH_BUILD_TESTS=OFF \
                -DNETMECH_BUILD_EXAMPLES=OFF

      - name: 构建
        run: cmake --build build --parallel

      - name: 跑一小段（非门禁）
        run: |
          set +e
          timeout 30 ./build/bin/bench_strand post plain > /tmp/bench.log 2>&1
          rc=$?
          cat /tmp/bench.log || true
          if grep -qE '[0-9]' /tmp/bench.log; then exit 0; fi
          if [ "$rc" -eq 124 ]; then exit 0; fi
          echo "❌ bench 没有产生数值输出（rc=$rc）"; exit 1

  # ---------------------------------------------------------------------------
  # 契约文档检查：docs/contracts.md 必须存在，且引用的测试文件都存在。
  # ---------------------------------------------------------------------------
  contracts-doc:
    name: 契约文档检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 检查 docs/contracts.md 与测试索引
        run: |
          set -e
          [ -f docs/contracts.md ] || { echo "❌ 缺少 docs/contracts.md"; exit 1; }
          fail=0
          for f in $(grep -oE 'test[A-Za-z0-9_/.*-]+\.cpp' docs/contracts.md | sort -u); do
            if compgen -G "$f" > /dev/null; then continue; fi
            if compgen -G "test/$f" > /dev/null; then continue; fi
            echo "❌ 契约文档引用了不存在的测试: $f"
            fail=1
          done
          [ $fail -eq 0 ] || exit 1
          echo "✅ 契约文档索引有效"

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: 配置（Debug + sanitizer）
        run: |
          cmake -S . -B build-san -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
                -DNETMECH_BUILD_TESTS=ON

      - name: 构建
        run: cmake --build build-san --parallel

      - name: 测试（sanitizer 一旦报错立即失败）
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-san --output-on-failure --timeout 300


  # ---------------------------------------------------------------------------
  # TSan（数据竞争）
  #
  # ASan/UBSan 抓不到数据竞争：两个线程同时写一块内存，读到的值"碰巧对"时
  # 什么症状都没有。库的契约是"回调在该连接的 io 线程上串行"，一旦哪里漏了
  # 一次同步，只有 TSan 看得出来。
  #
  # 2026-11 第一次开这个 job 时，全量报出 54 条，其中 3 条落在库代码里
  # （Conn::close/self_ref）。顺藤摸瓜查下去发现是**测试夹具**把 shared_ptr
  # 跨线程读写（撕裂成悬垂指针，解引用发生在库代码里，报告就挂在了库头上）。
  # 修完夹具后是 0 条 —— 所以这里**不留 suppression**：再报就是真问题。
  #
  # 注意 halt_on_error=1：一报就红，不给自己"累积一堆再看"的余地。
  # ---------------------------------------------------------------------------
  tsan:
    name: TSan
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: 配置（Debug + TSan）
        run: |
          cmake -S . -B build-tsan -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1" \
                -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
                -DNETMECH_BUILD_TESTS=ON \
                -DNETMECH_BUILD_EXAMPLES=OFF

      - name: 构建
        run: cmake --build build-tsan --parallel

      - name: 测试（报告任何数据竞争即失败）
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=4
        run: ctest --test-dir build-tsan --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  # TLS + ASan/UBSan：TLS 实现里有大量"长度/偏移由对端决定"的解析（记录层、
  # 证书摘要、指纹比对），越界与下溢最值得用 sanitizer 咬一遍。
  # ---------------------------------------------------------------------------
  sanitizers-tls:
    name: ASan + UBSan / TLS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具（含 OpenSSL 开发包）
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev

      - name: 配置（Debug + sanitizer + TLS）
        run: |
          cmake -S . -B build-san -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DNETMECH_TLS=ON \
                -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
                -DNETMECH_BUILD_TESTS=ON

      - name: 构建
        run: cmake --build build-san --parallel

      - name: 测试
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          LSAN_OPTIONS: detect_leaks=0
        run: ctest --test-dir build-san --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  # TLS + TSan
  #
  # TLS 的握手状态机跨"发起线程 / io 线程"，且 TlsContext（SSL_CTX）是
  # 监听器与每条连接共享的 —— 这类共享最容易漏同步。
  # ---------------------------------------------------------------------------
  tsan-tls:
    name: TSan / TLS
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: 安装工具（含 OpenSSL 开发包）
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ libssl-dev

      - name: 配置（Debug + TSan + TLS）
        run: |
          cmake -S . -B build-tsan -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DNETMECH_TLS=ON \
                -DCMAKE_C_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1" \
                -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer -g -O1" \
                -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread" \
                -DNETMECH_BUILD_TESTS=ON \
                -DNETMECH_BUILD_EXAMPLES=OFF

      - name: 构建
        run: cmake --build build-tsan --parallel

      - name: 测试
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:history_size=4
        run: ctest --test-dir build-tsan --output-on-failure --timeout 300

  # ---------------------------------------------------------------------------
  # 质量门禁
  # ---------------------------------------------------------------------------
  quality:
    name: 质量检查
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 检查禁止的 C++20 特性
        run: |
          FAIL=0
          # 只看代码，跳过纯注释行（注释里提到 std::span / boost:: 是正常的）
          for pat in 'co_await' 'co_return' 'co_yield' 'std::span' 'std::format' \
                     'std::jthread' 'std::atomic_ref' '\bconcept\b' '\branges::' '<=>'; do
            hits=$(grep -rEn "$pat" include/ src/ example/ test/ \
                     --include='*.hpp' --include='*.cpp' 2>/dev/null \
                   | grep -vE '^[^:]+:[0-9]+:[[:space:]]*//' || true)
            if [ -n "$hits" ]; then
              echo "❌ 发现禁止的构造: $pat"
              echo "$hits"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ 未发现 C++20 构造"

      - name: 检查第三方头依赖边界（Boost / OpenSSL）
        run: |
          # 只看 #include：注释里提到 boost:: / openssl 是在讲"为什么不用它"。
          fail=0

          # 1) 任何地方都不许引 Boost（本库只用 thirdparty 里的独立 Asio）。
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<boost/' \
               include/ src/ example/ test/ --include='*.hpp' --include='*.cpp'; then
            echo "❌ 发现 boost 的 #include（本库只用 thirdparty 里的独立 Asio）"
            fail=1
          fi

          # 2) 对外头文件一行第三方头都不许引 —— 装出去的包不带这些依赖。
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(asio|asio\.hpp|openssl)/' \
               include/ --include='*.hpp'; then
            echo "❌ 对外头文件引了 asio / openssl"
            fail=1
          fi

          # 3) OpenSSL 只允许出现在 TLS 实现与 TLS 测试里，且必须落在
          #    NETMECH_HAS_TLS 保护下（-DNETMECH_TLS=OFF 时一行都不该进来）。
          for f in $(grep -rlE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<openssl/' \
                       src/ test/ --include='*.hpp' --include='*.cpp' || true); do
            case "$f" in
              src/tls_internal.hpp|src/tls_transport.cpp|test/test_tls_e2e.cpp) ;;
              *) echo "❌ $f 不在 OpenSSL 允许清单内"; fail=1; continue ;;
            esac
            if ! grep -q 'NETMECH_HAS_TLS' "$f"; then
              echo "❌ $f 引了 openssl 却没有 NETMECH_HAS_TLS 保护（OFF 构建会编不过）"
              fail=1
            fi
          done

          [ $fail -eq 0 ] || exit 1
          echo "✅ 第三方依赖边界正常"

      - name: 检查 thirdparty 完整性
        run: |
          if [ ! -f thirdparty/asio/include/asio.hpp ]; then
            echo "❌ 缺少 thirdparty/asio/include/asio.hpp"
            exit 1
          fi
          if [ ! -f thirdparty/asio/LICENSE_1_0.txt ]; then
            echo "❌ 缺少 Asio 许可证文件（Boost License 要求保留）"
            exit 1
          fi
          echo "✅ thirdparty 完整"

      - name: 检查对外头文件不依赖 Asio
        run: |
          # 装出去的包**不带 Asio**（公共头一行 asio 都不引，asio 只在 src/ 里用）。
          # 一旦有人在 include/ 里加回 `#include <asio/...>`，使用者就得自己装
          # 一套 Asio 才编得过 —— 这条检查用来守住这个边界。
          if grep -rnE '^[[:space:]]*#[[:space:]]*include[[:space:]]*<(asio|asio\.hpp)' \
               include/ --include='*.hpp'; then
            echo "❌ 对外头文件包含了 asio（装出去的包不该依赖它）"
            exit 1
          fi
          echo "✅ 对外头文件无 asio 依赖"

      - name: 检查测试不得用大 sleep 做同步
        run: |
          # 正事件等待必须用 wait_for / wait_until；sleep 只允许负断言观察窗（<=150ms）。
          hits=$(grep -rnE 'sleep_for\(([2-9][0-9]{2}|[0-9]{4,})ms\)' test/ \
                   --include='*.cpp' --include='*.hpp' || true)
          if [ -n "$hits" ]; then
            echo "❌ 发现 >=200ms 的 sleep_for（请改用条件等待）"
            echo "$hits"
            exit 1
          fi
          echo "✅ 无大 sleep 同步等待"

      - name: 检查每个对外头文件可单独包含
        run: |
          sudo apt-get update && sudo apt-get install -y g++
          FAIL=0
          for h in include/netmech/*.hpp; do
            name=$(basename "$h" .hpp)
            printf '#include <netmech/%s.hpp>\nint main(){return 0;}\n' "$name" > /tmp/one.cpp
            if ! g++ -std=c++17 -fsyntax-only -Wall -Wextra \
                 -Iinclude -Ithirdparty/asio/include /tmp/one.cpp; then
              echo "❌ $name.hpp 不能单独包含"
              FAIL=1
            fi
          done
          if [ $FAIL -eq 1 ]; then exit 1; fi
          echo "✅ 全部头文件自包含"
